<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1F1B16">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="Haz tu pedido en línea">
  <title>Haz tu pedido</title>
  <link rel="manifest" href="manifest-cliente.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MiPedido">
  <link rel="icon" href="iconos/icono-192.png" type="image/png">
  <link rel="apple-touch-icon" href="iconos/icono-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/modulos.css">
</head>
<body>
  <div class="pedir-app" id="pedir">
    <header class="pedir-portada">
      <div class="marca-logo" data-marca-logo aria-hidden="true"></div>
      <h1 data-marca-nombre>Haz tu pedido</h1>
      <p id="pedir-bienvenida">Cargando el menú…</p>
    </header>
    <section class="seguimiento" id="seguimiento" hidden aria-live="polite"></section>
    <main class="pedir-cuerpo" id="pedir-cuerpo">
      <div class="lista" aria-busy="true"><div class="esqueleto" style="min-height:220px"></div><div class="esqueleto" style="min-height:220px"></div></div>
    </main>
    <footer class="pedir-pie"><div style="margin-bottom:12px"><button type="button" class="btn secundario chico" id="instalar-pwa" hidden style="margin:8px auto">Instalar MiPedido</button></div><button class="enlace" type="button" id="pie-politicas">📋 Cómo funciona tu pedido</button> · <a href="privacidad.html" target="_blank" rel="noopener">🔒 Privacidad</a></footer>
  </div>
  <div class="barra-pedido" id="barra-pedido" hidden>
    <button class="btn" id="btn-ver-pedido" type="button"></button>
  </div>
  <noscript><p style="padding:20px">Para pedir necesitas activar JavaScript.</p></noscript>
  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/datos.js"></script>
  <script src="js/comun.js"></script>
  <script src="js/mapa.js"></script>
  <script src="js/qr.js"></script>
  <script src="js/pedir.js"></script>
<script src="js/pwa-cliente.js"></script>
</body>
</html>
