<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MiPedido | Registro comercial local</title><style>body{font:16px system-ui;max-width:900px;margin:40px auto;padding:20px;background:#f4f6fa;color:#18304b}form,article{background:white;padding:20px;border-radius:12px;margin:12px 0}label{display:block;margin:10px 0}input,select,button{font:inherit;padding:8px}button{cursor:pointer}article{overflow-wrap:anywhere}</style><h1>Registro comercial MiPedido</h1><p>Herramienta local del proveedor. No controla instalaciones remotas ni autentica al operador. No guardar contraseñas.</p><form id="f"><label>Empresa <input name="empresa" required maxlength="120"></label><label>ID empresa <input name="id" required pattern="[A-Za-z0-9_-]{1,80}"></label><label>Vencimiento <input name="vence" type="date" required></label><label>Locales autorizados <input name="max" type="number" min="1" max="10000" required></label><label>Estado <select name="estado"><option>activa</option><option>suspendida</option></select></label><button>Guardar / renovar</button></form><button id="exportar">Exportar respaldo JSON</button><label>Importar respaldo <input id="importar" type="file" accept=".json"></label><main id="lista"></main><script>
const key='mipedido_registro_proveedor_v1',f=document.getElementById('f'),lista=document.getElementById('lista');let rows=[];function valido(x){return x&&typeof x.empresa==='string'&&x.empresa.trim()&&x.empresa.length<=120&&/^[A-Za-z0-9_-]{1,80}$/.test(x.id)&&/^\d{4}-\d{2}-\d{2}$/.test(x.vence)&&Number.isFinite(Date.parse(x.vence))&&new Date(x.vence).toISOString().slice(0,10)===x.vence&&Number.isInteger(x.max)&&x.max>=1&&x.max<=10000&&['activa','suspendida'].includes(x.estado)}function save(next){localStorage.setItem(key,JSON.stringify(next));rows=next;render()}function render(){lista.replaceChildren();for(const x of rows){const a=document.createElement('article'),p=document.createElement('p'),b=document.createElement('button');p.textContent=x.empresa+' | '+x.id+' | '+x.estado+' | vence '+x.vence+' | '+x.max+' locales';b.textContent='Editar';b.onclick=()=>{for(const k of ['empresa','id','vence','max','estado'])f.elements[k].value=x[k]};a.append(p,b);const pre=document.createElement('pre');pre.textContent='Configuración manual autorizada:\nlicencia_estado = '+x.estado+'\nlicencia_vence = '+x.vence+'\nLICENCIA_MAX_LOCALES = '+x.max;a.append(pre);lista.append(a)}}try{const x=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(x)&&x.every(valido))rows=x;else throw Error('Registro inválido')}catch(e){alert(e.message)}render();f.onsubmit=e=>{e.preventDefault();const x=Object.fromEntries(new FormData(f));x.max=Number(x.max);if(!valido(x))return alert('Datos inválidos');try{save([...rows.filter(r=>r.id!==x.id),x]);f.reset()}catch(e){alert(e.message)}};document.getElementById('exportar').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(rows,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='mipedido-licencias.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};document.getElementById('importar').onchange=async e=>{try{const x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x)||!x.every(valido)||new Set(x.map(r=>r.id)).size!==x.length)throw Error('Respaldo inválido');if(confirm('¿Reemplazar registro local?'))save(x)}catch(err){alert(err.message)}e.target.value=''};
</script></html>
