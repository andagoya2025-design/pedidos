name: MiPedido - antirregresion
on:
  push:
    branches:
      - fix/antirregresion-pedidos-20261123
      - desarrollo/fase1b-comercial-integral
      - fix/fase1b1-instalacion
      - fix/pedidos-premium
      - 'candidata/**'
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sintaxis JavaScript cliente, restaurante y motorizados
        run: |
          for f in js/*.js sw.js; do node --check "$f"; done
          node --check js/pedir.js
          node --check js/pedidos.js
          node --check js/motorizados.js
      - name: Sintaxis Apps Script
        run: node -e "new (require('vm').Script)(require('fs').readFileSync('servidor/Codigo.gs', 'utf8'))"
      - name: Pruebas unitarias antirregresivas
        run: node --test tests/*.test.js
  navegador:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar navegador de prueba
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Interacción móvil con datos ficticios
        run: node tests/navegador-preenvio.cjs

      - name: Sustitución premium en pantallas pequeñas
        run: node tests/navegador-sustitucion.cjs

      - name: Bancos configurables en móvil y escritorio
        run: node tests/navegador-bancos.cjs

      - name: Seguridad y acceso por rol en móvil y escritorio
        run: node tests/navegador-seguridad.cjs

      - name: Centro de avisos y voz en móvil y escritorio
        run: node tests/navegador-notificaciones.cjs

      - name: Avisos del cliente en móvil y escritorio
        run: node tests/navegador-avisos-cliente.cjs
