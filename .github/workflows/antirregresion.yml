name: MiPedido - antirregresion
on:
  push:
    branches:
      - fix/antirregresion-pedidos-20261123
      - desarrollo/fase1b-comercial-integral
      - fix/fase1b1-instalacion
      - fix/pedidos-premium
      - 'candidata/**'
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sintaxis JavaScript cliente, restaurante y motorizados
        run: |
          for f in js/*.js sw.js; do node --check "$f"; done
          node --check js/pedir.js
          node --check js/pedidos.js
          node --check js/motorizados.js
      - name: Sintaxis Apps Script
        run: node -e "new (require('vm').Script)(require('fs').readFileSync('servidor/Codigo.gs', 'utf8'))"
      - name: Pruebas unitarias antirregresivas
        run: node --test tests/*.test.js
  navegador:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar navegador de prueba
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Interacción móvil con datos ficticios
        run: node tests/navegador-preenvio.cjs

      - name: Sustitución premium en pantallas pequeñas
        run: node tests/navegador-sustitucion.cjs

      - name: Bancos configurables en móvil y escritorio
        run: node tests/navegador-bancos.cjs

      - name: Seguridad y acceso por rol en móvil y escritorio
        run: node tests/navegador-seguridad.cjs

      - name: Centro de avisos y voz en móvil y escritorio
        run: node tests/navegador-notificaciones.cjs

      - name: Avisos del cliente en móvil y escritorio
        run: node tests/navegador-avisos-cliente.cjs

      - name: Revisión previa y cancelación independiente en los tres dispositivos
        run: node tests/navegador-revision-cambios.cjs

      - name: Presentación premium administrativa sin alterar controles
        run: node tests/navegador-premium-visual.cjs

      - name: Comparación élite de pantallas reales con datos ficticios
        run: node tests/navegador-premium-elite.cjs

      - name: Botón de ayuda del motorizado y menú sin palabras partidas
        run: node tests/navegador-ayuda.cjs

      - name: Activar mi ubicación del motorizado y formulario de inventario
        run: node tests/navegador-ubicacion-inventario.cjs

      - name: Actualización automática de la app sin bloqueos y con aviso visible
        run: node tests/navegador-actualizacion.cjs
      - name: Capturas antes y después
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comparacion-premium-elite
          path: capturas-elite/
          if-no-files-found: warn

      - name: Premium integral y entregas reales simuladas
        run: node tests/navegador-integral.cjs
      - name: Monitoreo seguro y estados GPS en cuatro pantallas
        run: node tests/navegador-monitoreo.cjs
      - name: Service worker real - actualización y reversión sin perder sesión
        run: node tests/navegador-reversion-monitoreo.cjs
      - name: Capturas del monitoreo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitoreo-3.1.50
          path: capturas-monitoreo/
          if-no-files-found: warn
      - name: Capturas cliente y motorizado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comparacion-premium-integral
          path: capturas-integral/
          if-no-files-found: warn

  simulacion-revision:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar navegadores
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium webkit

      - name: Revisión inicial definitiva en navegadores
        run: node tests/navegador-revision-inicial.cjs
      - name: Capturas de revisión definitiva
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revision-final-3.1.47
          path: capturas-revision-final/
          if-no-files-found: warn
